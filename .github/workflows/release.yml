name: Build and Release macOS Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Universal .app, .zip, .pkg, and .dmg
        run: |
          chmod +x package.sh install.sh uninstall.sh scripts/*.sh resources/pkg-scripts/postinstall
          ./package.sh

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pkg
            dist/*.dmg
            dist/*-universal.zip
            dist/checksums.txt
          generate_release_notes: true
